name: Validate integration
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile Python
        run: python -m compileall -q custom_components/ha_auto_device_phase_mapping
      - name: Check JSON
        run: python -c 'import json,pathlib; [json.loads(p.read_text()) for p in pathlib.Path(".").rglob("*.json")]'
      - name: Check JavaScript syntax
        run: |
          node --check custom_components/ha_auto_device_phase_mapping/frontend/phase-mapper.js
          node tests/test_frontend.cjs
          node tests/test_version_check.cjs
      - name: Test pure correlation helper
        run: python -m unittest discover -s tests -v
